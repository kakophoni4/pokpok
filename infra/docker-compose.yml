# Production stack: database, API, Telegram bot, and Caddy serving the site.
#
#   cd infra && cp .env.example .env && nano .env && docker compose up -d --build
#
# Only Caddy publishes ports. Postgres and the API are reachable on the internal
# network only, so the database is never exposed to the internet by accident.

name: poker-league

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Russian club, Russian collation for name sorting.
      LANG: ru_RU.utf8
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-900}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-2592000}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      CORS_ORIGINS: ${PUBLIC_URL}
      PUBLIC_WEB_URL: ${PUBLIC_URL}
      PUBLIC_API_URL: ${PUBLIC_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      # Generous: the first boot applies migrations before it starts listening.
      start_period: 90s
      retries: 5

  bot:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: bot
    # Bounded on purpose: with no TELEGRAM_BOT_TOKEN the bot refuses to start, and
    # `unless-stopped` would turn a first deploy without a bot into an endless
    # restart loop in the logs. It gives up instead, and the site is unaffected.
    restart: on-failure:3
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      # Straight to the container: no reason to loop out through the proxy and TLS.
      PUBLIC_API_URL: http://api:3000
      PUBLIC_WEB_URL: ${PUBLIC_URL}

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
      args:
        # Baked into the JavaScript bundle, so changing it needs a rebuild.
        VITE_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
    ports:
      # Overridable because port 80 is frequently occupied on a server that
      # already hosts something. 443 is what actually matters: certificates are
      # issued over TLS-ALPN, so the stack works with 80 mapped anywhere.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Certificates survive restarts; losing them means re-issuing on every
      # deploy and running into Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy

volumes:
  db-data:
  caddy-data:
  caddy-config:
  caddy-logs:
