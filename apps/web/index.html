<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Клуб спортивного покера</title>
    <meta
      name="description"
      content="Расписание игр, запись на турниры, рейтинг и достижения клуба спортивного покера."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0b1210" />

    <!-- iOS: makes "На экран «Домой»" open as a standalone app without Safari chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Покер клуб" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Loaded before React so Mini App ready()/initData exist on the first paint. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        try {
          var app = window.Telegram && window.Telegram.WebApp;
          if (app) {
            app.ready();
            app.expand();
            if (app.initData) window.__TG_INIT_DATA__ = app.initData;
            if (app.platform && app.platform !== "unknown") window.__TG_PLATFORM__ = app.platform;
          }
          var hash = location.hash.charAt(0) === "#" ? location.hash.slice(1) : location.hash;
          var params = new URLSearchParams(hash);
          var data = params.get("tgWebAppData");
          var plat = params.get("tgWebAppPlatform");
          if (data) window.__TG_INIT_DATA__ = data;
          if (plat) window.__TG_PLATFORM__ = plat;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
